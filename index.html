<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/modules/api.js"></script>
  <script src="js/modules/auth.js"></script>
  <script src="js/modules/ui.js"></script>
  <script src="js/modules/embed.js"></script>
  <script src="js/app.js"></script>
</head>
<body>
  <header>
    <span class="logo">News</span>
  </header>
  <main>
    <div id="news-list" class="news-list"></div>
  </main>
  <footer>
    <button class="tab active"><i class="fa-solid fa-house"></i><span class="tab-label">Home</span></button>
    <button class="tab" onclick="window.location='/admin/login.html'"><i class="fa-solid fa-lock"></i><span class="tab-label">Admin</span></button>
  </footer>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const articles = await window.App.api.getNews();
        window.App.ui.renderNewsList(articles);
      } catch (e) {
        window.App.ui.showMessage('Failed to load news', 'error');
      }
    });
  </script>
</body>
</html>
