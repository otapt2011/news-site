<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/modules/api.js"></script>
  <script src="../js/modules/auth.js"></script>
  <script src="../js/modules/ui.js"></script>
  <script src="../js/app.js"></script>
</head>
<body>
  <header>
    <span class="logo">Dashboard</span>
  </header>
  <main id="dashboard"></main>
  <footer>
    <button class="tab" onclick="window.location='edit.html'"><i class="fa-solid fa-plus-circle" style="color: #0a0;"></i></button>
    <button class="tab" onclick="window.location='../index.html'"><i class="fa-solid fa-house" style="color: #888;"></i></button>
  </footer>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!window.App.auth.isLoggedIn()) {
        window.App.auth.requireAuth();
        return;
      }
      try {
        const articles = await window.App.api.getNews();
        window.App.ui.renderDashboard(articles);
      } catch (e) {
        window.App.ui.showMessage('Error loading articles', 'error');
      }
    });

    window.deleteArticle = async (id) => {
      if (!confirm('Delete this article?')) return;
      try {
        await window.App.api.deleteArticle(id, window.App.auth.getToken());
        location.reload();
      } catch (e) {
        window.App.ui.showMessage('Delete failed', 'error');
      }
    };
  </script>
</body>
</html>
