<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/modules/api.js"></script>
  <script src="js/modules/auth.js"></script>
  <script src="js/modules/ui.js"></script>
  <script src="js/modules/embed.js"></script>
  <script src="js/app.js"></script>
</head>
<body>
  <header>
    <button class="back-btn" onclick="history.back()"><i class="fa-solid fa-chevron-left"></i></button>
    <span class="logo">News</span>
  </header>
  <main id="article-detail"></main>
  <footer>
    <button class="tab" onclick="window.location='/'"><i class="fa-solid fa-house"></i><span class="tab-label">Home</span></button>
  </footer>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      if (!id) return window.App.ui.showMessage('No article ID', 'error');
      try {
        const article = await window.App.api.getArticle(id);
        window.App.ui.renderArticle(article);
        if (article.embed_type !== 'none') {
          window.App.embed.renderEmbed(article.embed_type, article.embed_url);
        }
      } catch (e) {
        window.App.ui.showMessage('Article not found', 'error');
      }
    });
  </script>
</body>
</html>
